# Substitute domain and certificate paths before installing.
server {
    listen 443 ssl;
    server_name assistant.example.com;
    ssl_certificate /etc/real-pa/tls/fullchain.pem;
    ssl_certificate_key /etc/real-pa/tls/privkey.pem;

    # Conversation credentials and payloads must not appear in access logs.
    access_log off;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:18484;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location = /v1/realtime {
        proxy_pass http://127.0.0.1:18484;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

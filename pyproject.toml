[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-pa"
version = "0.1.0"
description = "Company-hosted inference and duplex robot dialogue control"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "websockets>=15,<18"]

[project.optional-dependencies]
audio = ["numpy>=1.26", "sounddevice>=0.5", "sherpa-onnx==1.13.5", "sherpa-onnx-core==1.13.5"]
dev = ["pytest>=8"]

[project.scripts]
real-pa = "real_pa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
real_pa = ["browser/*.html", "browser/*.js", "browser/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
